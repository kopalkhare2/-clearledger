# ============================================================
# ClearLedger — Application Configuration
# ============================================================

# Server (Render injects PORT environment variable)
server.port=${PORT:8080}

# DataSource (Supports Render PostgreSQL environment variables with local fallback)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/clearledger}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:clearledger}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:clearledger}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Logging
logging.level.com.clearledger=INFO
logging.level.org.springframework.transaction=DEBUG
logging.level.org.hibernate.SQL=INFO

# OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
