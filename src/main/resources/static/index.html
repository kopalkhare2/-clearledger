<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ClearLedger — Core Financial Operations</title>
  <meta name="description" content="ClearLedger Core Financial Ledger, Double-Entry Invariants, Settlement Reconciliation, and Audit Operations" />

  <!-- Google Fonts: Inter with tabular figures -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />

  <!-- Design System -->
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="app-container">
    <!-- Sidebar Navigation -->
    <aside class="sidebar">
      <div class="brand-section">
        <div class="brand-logo">CL</div>
        <div class="brand-text">
          <h1>ClearLedger</h1>
          <p>Financial Ops</p>
        </div>
      </div>

      <nav class="nav-menu">
        <div class="nav-category">Overview</div>
        <a href="#dashboard" class="nav-item active" data-screen="dashboard">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
          <span>Dashboard</span>
        </a>

        <div class="nav-category">Ledger Operations</div>
        <a href="#accounts" class="nav-item" data-screen="accounts">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
          <span>Accounts</span>
        </a>

        <a href="#transactions" class="nav-item" data-screen="transactions">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="17 1 21 5 17 9"></polyline><path d="M3 11V9a4 4 0 0 1 4-4h14"></path><polyline points="7 23 3 19 7 15"></polyline><path d="M21 13v2a4 4 0 0 1-4 4H3"></path></svg>
          <span>Transfers</span>
        </a>

        <a href="#statements" class="nav-item" data-screen="statements">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>
          <span>Statements</span>
        </a>

        <div class="nav-category">Reconciliation</div>
        <a href="#reconciliation" class="nav-item" data-screen="reconciliation">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>
          <span>Settlement Feeds</span>
        </a>

        <a href="#discrepancies" class="nav-item" data-screen="discrepancies">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
          <span>Discrepancy Desk</span>
          <span class="nav-badge" id="discrepanciesBadge" style="display:none;">0</span>
        </a>

        <a href="#resolution_history" class="nav-item" data-screen="resolution_history">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 14 14"></polyline></svg>
          <span>Audit Timeline</span>
        </a>

        <div class="nav-category">Integrity & Audit</div>
        <a href="#trial-balance" class="nav-item" data-screen="trial-balance">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v18"></path><path d="M5 8l7-5 7 5"></path><path d="M5 8v6a3 3 0 0 0 6 0V8"></path><path d="M13 8v6a3 3 0 0 0 6 0V8"></path></svg>
          <span>Trial Balance</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <span title="ClearLedger Engine">v1.0.0</span>
        <a href="/swagger-ui.html" target="_blank" title="Open API Documentation">API ↗</a>
      </div>
    </aside>

    <!-- Main Content Area -->
    <div class="main-wrapper">
      <!-- Top Sticky Header -->
      <header class="top-header">
        <div class="header-left">
          <h1 class="page-title" id="pageTitle">Dashboard</h1>
          <span class="page-subtitle" id="pageSubtitle">Executive overview</span>
        </div>

        <div class="header-right">
          <!-- Live Ledger Invariant Indicator -->
          <div class="ledger-health-pill" id="ledgerHealthPill" onclick="navigateTo('trial-balance')" title="View Trial Balance & Invariant Audit">
            <span class="status-dot"></span> Ledger Online
          </div>
          <button class="btn btn-secondary btn-sm" onclick="openTransferModal()">New Transfer</button>
        </div>
      </header>

      <!-- Content Area -->
      <main class="content-area" id="contentArea">
        <div class="empty-state">
          <div class="spinner"></div>
          <p style="margin-top:0.75rem;">Initializing...</p>
        </div>
      </main>
    </div>
  </div>

  <!-- Reusable Global Modal Dialog -->
  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal-card">
      <div class="modal-header">
        <h3 class="panel-title" id="modalTitle">Modal Title</h3>
        <button onclick="closeModal()" aria-label="Close modal" title="Close">&times;</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-footer">
        <button class="btn btn-secondary btn-sm" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary btn-sm" id="modalConfirmBtn">Confirm</button>
      </div>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- Scripts -->
  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
